name: Temporary MIPS MSVC alignment qualification

on:
  push:
    branches: [codex/mips-msvc-memory-alignment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alignment:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Build the old and corrected MIPS references
        shell: pwsh
        run: |
          choco install ninja --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory evidence | Out-Null
          git worktree add --detach baseline 0b976580a5447dff2fd6822f07b4683c33392d78
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item tests/unit/test_mips.c baseline/tests/unit/test_mips.c
          foreach ($variant in @('before', 'after')) {
            $source = if ($variant -eq 'before') { 'baseline' } else { '.' }
            cmake -S $source -B "build-$variant" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DBUILD_SHARED_LIBS=OFF -DUNICORN_ARCH=mips -DUNICORN_BUILD_TESTS=ON 2>&1 | Tee-Object "evidence/configure-$variant.log"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cmake --build "build-$variant" --target test_mips --parallel 4 2>&1 | Tee-Object "evidence/build-$variant.log"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Get-FileHash "build-$variant/test_mips.exe" | Format-List | Out-File "evidence/hash-$variant.txt"
          }
          git rev-parse HEAD | Out-File evidence/candidate.txt
          Get-Content build-after/CMakeCache.txt | Out-File evidence/cmake-cache.txt
      - name: Confirm the native negative control and corrected results
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & ./build-before/test_mips.exe test_mips_fp_memory_alignment 2>&1 | Tee-Object evidence/before-alignment.log
          if ($LASTEXITCODE -ne 1) { throw 'The old MSVC reference did not reproduce the expected failure' }
          & ./build-before/test_mips.exe test_mips_r6_fp_unaligned_memory 2>&1 | Tee-Object evidence/before-r6-control.log
          if ($LASTEXITCODE) { throw 'The R6 unaligned control failed before the correction' }
          foreach ($attempt in 1..3) {
            & ./build-after/test_mips.exe 2>&1 | Tee-Object "evidence/after-$attempt.log"
            if ($LASTEXITCODE) { throw 'The corrected MIPS reference failed' }
          }
      - name: Preserve the bounded native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mips-msvc-alignment
          path: evidence/
          retention-days: 7
